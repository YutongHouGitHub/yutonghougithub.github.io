<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Photography portfolio" />
    <meta name="author" content="Yutong HOU" />
    <title>Photography | Yutong HOU</title>
    <link rel="icon" type="image/x-icon" href="static/assets/favicon.ico" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link type="text/css" href="static/css/styles.css" rel="stylesheet" />
    <link type="text/css" href="static/css/main.css" rel="stylesheet" />
    <style>
        :root {
            --bg: #f5f3f1;
            --panel: #ffffff;
            --text: #191919;
            --muted: #666666;
            --line: rgba(17, 17, 17, 0.08);
            --shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
            --overlay: rgba(10, 10, 10, 0.72);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "Times New Roman", Times, serif;
        }

        .photo-page {
            max-width: 1180px;
            margin: 80px auto 60px;
            padding: 0 20px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .photo-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .photo-header h1 {
            font-size: clamp(2.2rem, 2.8vw, 3.4rem);
            margin: 0 0 10px;
            letter-spacing: -0.04em;
            font-weight: 700;
            font-family: "Times New Roman", Times, serif;
        }

        .photo-header p {
            margin: 0;
            color: var(--muted);
            font-size: 1rem;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 20px;
            align-items: start;
        }

        .photo-card {
            display: flex;
            flex-direction: column;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .photo-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.12);
        }

        .photo-card img {
            display: block;
            width: 100%;
            height: auto;
            background: #f3f1ee;
        }

        .photo-info {
            padding: 14px 16px 16px;
        }

        .photo-title {
            margin: 0 0 6px;
            font-size: 1.06rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            font-family: "Times New Roman", Times, serif;
        }

        .photo-location {
            margin: 0;
            color: var(--muted);
            font-size: 0.9rem;
            font-family: "Times New Roman", Times, serif;
        }

        .lightbox {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: var(--overlay);
            padding: 24px;
            z-index: 1000;
        }

        .lightbox.open {
            display: flex;
        }

        .lightbox-panel {
            position: relative;
            width: min(1180px, 94vw);
            max-height: 90vh;
            overflow: auto;
            background: rgba(255,255,255,0.96);
            border-radius: 18px;
            box-shadow: 0 22px 50px rgba(0,0,0,0.25);
            padding: 18px;
        }

        .lightbox-close {
            position: absolute;
            top: 12px;
            right: 14px;
            border: none;
            background: rgba(0,0,0,0.06);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .lightbox-header {
            padding-right: 44px;
            margin-bottom: 16px;
        }

        .lightbox-header h2 {
            margin: 0 0 4px;
            font-size: 1.6rem;
            font-family: "Times New Roman", Times, serif;
        }

        .lightbox-header p {
            margin: 0;
            color: var(--muted);
            font-family: "Times New Roman", Times, serif;
        }

        .lightbox-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .gallery-pair {
            display: grid;
            grid-column: 1 / -1;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 14px;
        }

        .gallery-pair > img,
        .gallery-stack > img,
        .gallery-single {
            align-self: start;
        }

        .gallery-stack {
            display: grid;
            gap: 14px;
        }

        .gallery-single {
            width: 100%;
        }

        .lightbox-grid img {
            display: block;
            width: 100%;
            height: auto;
            margin: 0 auto;
            border-radius: 12px;
            background: #ececec;
        }

        @media (max-width: 640px) {
            .lightbox-grid {
                grid-template-columns: 1fr;
            }

            .gallery-pair {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

        const grid = document.getElementById('photoGrid');
        const lightbox = document.getElementById('lightbox');
        const galleryTitle = document.getElementById('galleryTitle');
        const galleryLocation = document.getElementById('galleryLocation');
        const galleryGrid = document.getElementById('galleryGrid');
        const closeBtn = document.querySelector('.lightbox-close');

        function createCard(work) {
            const card = document.createElement('article');
            card.className = 'photo-card';
            card.innerHTML = `
                <img src="${work.cover}" alt="${work.title}" />
                <div class="photo-info">
                    <h2 class="photo-title">${work.title}</h2>
                    <p class="photo-location">${work.location}</p>
                </div>
            `;
            card.addEventListener('click', () => openGallery(work));
            return card;
        }

        function openGallery(work) {
            galleryTitle.textContent = work.title;
            galleryLocation.textContent = work.location;
            galleryGrid.innerHTML = '';

            const createGalleryImage = (image) => {
                const img = document.createElement('img');
                img.src = image;
                img.alt = work.title;
                return img;
            };

            work.images.forEach(image => {
                galleryGrid.appendChild(createGalleryImage(image));
            });

            lightbox.classList.add('open');
            lightbox.setAttribute('aria-hidden', 'false');
        }

        function closeGallery() {
            lightbox.classList.remove('open');
            lightbox.setAttribute('aria-hidden', 'true');
        }

        works.forEach(work => {
            grid.appendChild(createCard(work));
        });

        closeBtn.addEventListener('click', closeGallery);
        lightbox.addEventListener('click', (event) => {
            if (event.target === lightbox) closeGallery();
        });
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeGallery();
        });
